map $http_upgrade $connection_upgrade { default upgrade; '' close; }
resolver 127.0.0.11 valid=5s ipv6=off;
access_log off;
error_log /dev/null;
client_max_body_size 10m;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
server { listen 8080; location / { set $upstream http://web:8080; proxy_pass $upstream; } }
server { listen 3001; location / { set $upstream http://api:3001; proxy_pass $upstream; } }
server { listen 3080; location / { set $upstream http://crm:3080; proxy_pass $upstream; } }
server { listen 8025; location / { set $upstream http://mailpit:8025; proxy_pass $upstream; } }
server { listen 5678; location / { set $upstream http://n8n:5678; proxy_pass $upstream; } }
